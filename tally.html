    <style>
        body {
            background-image: url(assets/backgrounds/bgtally.webp);
            background-repeat: round;
            animation-duration: 4s ;
            animation-name: backgroundscrolling ;
            animation-timing-function: linear ;
            animation-iteration-count: infinite;
        }

        @keyframes backgroundscrolling {
            0% {
                background-position: 0px 0px;
            }
            100% {
                background-position: 400px 0;
            }
        }

        .newsletter {
            width: 740px;
            border: 14px solid transparent;
            border-image: url(assets/backgrounds/tallylights1.webp) 14;
            border-image-repeat: repeat;
            animation-duration: 0.4s ;
            animation-name: lightsscrolling ;
            animation-timing-function: step-end ;
            animation-iteration-count: infinite;
            color: rgb(64, 255, 47);
        }

        .statistics { 
            border: 14px solid transparent;
            border-image: url(assets/backgrounds/tallylights1.webp) 14;
            border-image-repeat: repeat;
            width: 740px;
            animation-duration: 0.4s ;
            animation-name: lightsscrolling ;
            animation-timing-function: step-end ;
            animation-iteration-count: infinite;
            color: rgb(113, 113, 255);
        }

        @keyframes lightsscrolling {
            0% {
                border-image-source: url(assets/backgrounds/tallylights1.webp);
            }
            50% {
                border-image-source: url(assets/backgrounds/tallylights2.webp);
            }
            100% {
                border-image-source: url(assets/backgrounds/tallylights1.webp);
            }
        }

        .newsletterheader {
            font-size: 24px; 
            padding: 10px; 
            font-family: cursivepixel;
            color: rgb(88, 255, 37);
            text-shadow: 2px 2px 8px rgb(0, 71, 10);

        }

        .statsheader {

            padding: 10px; 
            font-family: cursivepixel;
            color: rgb(60, 60, 255);
            text-shadow: 2px 2px 8px rgb(0, 0, 131);

        }

        .oldpost:hover {
            color: rgb(255, 255, 255);
        }
        .oldpost:active {
            color: rgb(88, 255, 37);
        }
        .oldpost:visited {
            color: rgb(255, 204, 37);
        }
    </style>
