<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/altpagestyles.css">
    <title>Phone - sr64dd</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

    <style>
        html {
            filter: brightness(1);
            transition: filter 1s linear;
        }

        body {
            background-image: url(assets/backgrounds/bgphonefail.webp);
            background-repeat: round;
            animation-duration: 2s ;
            animation-name: backgroundscrolling ;
            animation-timing-function: linear ;
            animation-iteration-count: infinite;
        }

        .darkbg {
            filter: brightness(0.4);
        }

        @keyframes backgroundscrolling {
            0% {
                background-position: 0px 0px;
            }
            100% {
                background-position: 100px 0;
            }
        }

        .phonemain {
            position: relative;
        }

        .button {
            position: absolute;
            background-image: url(assets/phone/button.webp);
            width: 82px; 
            height: 67px;
        }

        .buttonred {
            background-image: url(assets/phone/buttonclear.webp);
        }

        .buttongreen {
            background-image: url(assets/phone/buttoncall.webp);
        }

        .button:active {
            background-image: url(assets/phone/buttonpressed.webp);
        }

        .buttonnumber {
            font-size: 20px; 
            font-weight: bolder;
            position: absolute; 
            color: rgb(149, 165, 179);
            font-family: devinChavez;
            user-select: none;
        }

        .phonescreen {
            font-size: 12px; 
            font-weight: bolder;
            position: absolute; 
            font-family: devinChavez;
            color: rgb(194, 36, 36);
            text-shadow: 0px 0px 8px #ff0000;
        }
    </style>
</head>
<body>
    <div id="page" class="page">
        <div id="leftside">
            <div id="logo" class="logo">
                <img src="assets/images/sr64decal.webp" width="240px" height="240px" draggable="false">
            </div>
            <aside id="sidebar" class="sidebar"></aside>
        </div>
        <main id="rightside" class="rightside">
            <div id="marquee" class="marq marqphone">
                <div id="marq1" class="marquee__item">
                </div>
            </div>
            <div id="content" class="content contentphone">
                <div id="phonemain" class="phonemain">
                    <img style="position: absolute; left: 70px;" src="assets/phone/phonemain.webp" draggable="false">

                    <a onclick="inputNumber('1')"><div class="button" style="left: 145px; top: 96px;"></div><span style="left: 175px; top: 112px;" class="buttonnumber">1</span></a>
                    <a onclick="inputNumber('2')"><div class="button" style="left: 218px; top: 96px;"></div><span style="left: 248px; top: 112px;" class="buttonnumber">2</span></a>
                    <a onclick="inputNumber('3')"><div class="button" style="left: 291px; top: 96px;"></div><span style="left: 321px; top: 112px;" class="buttonnumber">3</span></a>
                    <a onclick="inputNumber('4')"><div class="button" style="left: 145px; top: 158px;"></div><span style="left: 175px; top: 174px;" class="buttonnumber">4</span></a>
                    <a onclick="inputNumber('5')"><div class="button" style="left: 218px; top: 158px;"></div><span style="left: 248px; top: 174px;" class="buttonnumber">5</span></a>
                    <a onclick="inputNumber('6')"><div class="button" style="left: 291px; top: 158px;"></div><span style="left: 321px; top: 174px;" class="buttonnumber">6</span></a>
                    <a onclick="inputNumber('7')"><div class="button" style="left: 145px; top: 220px;"></div><span style="left: 175px; top: 236px;" class="buttonnumber">7</span></a>
                    <a onclick="inputNumber('8')"><div class="button" style="left: 218px; top: 220px;"></div><span style="left: 248px; top: 236px;" class="buttonnumber">8</span></a>
                    <a onclick="inputNumber('9')"><div class="button" style="left: 291px; top: 220px;"></div><span style="left: 321px; top: 236px;" class="buttonnumber">9</span></a>
                    <a onclick="inputNumber('0')"><div class="button" style="left: 218px; top: 282px;"></div><span style="left: 248px; top: 298px;" class="buttonnumber">0</span></a>

                    <a onclick="clearNumber()"><div class="button buttonred" style="left: 145px; top: 282px;"></div><span class="buttonnumber" style="left: 175px; top: 298px; color: rgb(179, 149, 149);;" >#</span></a>
                    <a onclick="enterNumber()"><div class="button buttongreen" style="left: 291px; top: 282px;"></div><span style="left: 321px; top: 298px;" class="buttonnumber"></span></a>

                    <span style="left: 168px; top: 360px;" class="phonescreen" id="phonescreen">enter a number</span>
                </div>
            </div>
        </main>
    </div>
</body>
<script>
    var safeMarquee = false
</script>
<script src="assets/marqueelogic.js"></script>
<script src="assets/phonelogic.js"></script>
<script src="assets/sidebarcomponent.js"></script>

</html>
